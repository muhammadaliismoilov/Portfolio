        function startTypewriter(target) {
          var words = ['Backend Developer', 'API Architect', 'Node.js Engineer'];
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            target.textContent = words[0];
            return;

          var wi = 0, ci = 0, deleting = false;
          function tick() {
            var word = words[wi];
            if (!deleting) {
              ci++;
              target.textContent = word.slice(0, ci);
              if (ci === word.length) { deleting = true; setTimeout(tick, 1600); return; }

            '<h1 class="text-4xl sm:text-6xl font-extrabold text-white mb-2">' + name + '</h1>' +
            '<div class="aiv-hero-role"><span class="aiv-role-text"></span><span class="aiv-cursor"></span></div>' +
            '<p class="aiv-hero-bio">Backend Developer specializing in scalable RESTful APIs with Node.js and TypeScript &mdash; clean architecture, JWT auth &amp; RBAC, SQL/NoSQL schema design, and real-world integrations like Telegram bots. Currently open to internship or junior backend roles.</p>' +
            '<div class="aiv-hero-ctas">' +
              '<a href="#projects" class="aiv-hero-btn aiv-hero-btn-primary">View Projects</a>' +
              '<a href="#contact" class="aiv-hero-btn aiv-hero-btn-outline">Get in Touch</a>' +
            '</div>' +
            '<div class="aiv-hero-social">' +
              '<a href="' + MAIL_HREF + '" aria-label="Ali Ismoilov — Email">' + SOCIAL_ICONS.mail + '</a>' +
              (links.github ? '<a href="' + links.github + '" target="_blank" rel="noopener noreferrer" aria-label="Ali Ismoilov — GitHub profile">' + SOCIAL_ICONS.github + '</a>' : '') +
              (links.linkedin ? '<a href="' + links.linkedin + '" target="_blank" rel="noopener noreferrer" aria-label="Ali Ismoilov — LinkedIn profile">' + SOCIAL_ICONS.linkedin + '</a>' : '') +
              (links.telegram ? '<a href="' + links.telegram + '" target="_blank" rel="noopener noreferrer" aria-label="Ali Ismoilov — Telegram">' + SOCIAL_ICONS.telegram + '</a>' : '') +
            '</div>' +
            '<div class="aiv-stats-row">' +
              '<div><div class="aiv-stat-num">3</div><div class="aiv-stat-label">Projects</div></div>' +
              '<div><div class="aiv-stat-num">3</div><div class="aiv-stat-label">Roles Held</div></div>' +
              '<div><div class="aiv-stat-num">27+</div><div class="aiv-stat-label">Technologies</div></div>' +
              '<div><div class="aiv-stat-num">2</div><div class="aiv-stat-label">Certifications</div></div>' +
            '</div>';

          var visual = document.createElement('div');
          visual.className = 'aiv-hero-visual';
          visual.innerHTML =
            '<div class="aiv-code-card">' +
              '<div class="aiv-code-card-head"><span class="aiv-traffic"><span></span><span></span><span></span></span><span class="aiv-fname">developer.ts</span></div>' +
              '<pre><span class="aiv-k">const</span> developer = {\n' +
              '  name: <span class="aiv-s">\'' + name + '\'</span>,\n' +
              '  role: <span class="aiv-s">\'Backend Developer\'</span>,\n' +
              '  focus: [<span class="aiv-s">\'Node.js\'</span>, <span class="aiv-s">\'NestJS\'</span>, <span class="aiv-s">\'PostgreSQL\'</span>],\n' +
              '  status: <span class="aiv-s">\'open_to_work\'</span>, <span class="aiv-c">// true</span>\n' +
              '};\n\n' +
              '<span class="aiv-k">export default</span> <span class="aiv-p">developer</span>;</pre>' +
            '</div>';

          wrap.appendChild(content);
          wrap.appendChild(visual);
          container.innerHTML = '';
          container.appendChild(wrap);

          startTypewriter(content.querySelector('.aiv-role-text'));
        }

        function rebuildContactSocial() {
          var contact = document.getElementById('contact');
          if (!contact || contact.dataset.aivContactSocial) return;

          var mailLink = contact.querySelector('a[href^="mailto:"]');
          var socialRow = contact.querySelector('.space-x-6');
          if (!mailLink || !socialRow) return;
          contact.dataset.aivContactSocial = '1';

          mailLink.remove();

          var a = document.createElement('a');
          a.href = MAIL_HREF;
          a.className = socialRow.firstElementChild ? socialRow.firstElementChild.className : 'text-gray-400 hover:text-white transition-colors';
          a.setAttribute('aria-label', 'Ali Ismoilov — Email');
          a.innerHTML = SOCIAL_ICONS.mail;
          socialRow.classList.add('aiv-contact-social');
          socialRow.insertBefore(a, socialRow.firstElementChild);
        }

        var EXPERIENCE_TECH = {
          'Mentor': ['JavaScript', 'TypeScript', 'Node.js', 'Express.js', 'NestJS', 'REST API', 'MongoDB', 'PostgreSQL'],
          'Backend Developer Intern': ['Node.js', 'Drizzle ORM', 'PostgreSQL', 'REST API', 'Swagger'],
          'Teacher Assistant': ['Node.js', 'JavaScript', 'Express.js']
        };

        function equalizeProjectCards() {
          var section = document.getElementById('projects');
          if (!section || section.dataset.aivEqualized) return;

          var descs = Array.prototype.filter.call(
            section.querySelectorAll('p'),
            function (p) { return p.classList.contains('text-gray-400') && p.classList.contains('text-sm'); }
          );
          if (descs.length < 2) return;
          section.dataset.aivEqualized = '1';

          descs.forEach(function (p) {
            p.classList.add('aiv-project-desc');
            var card = p.closest('.group') || p.parentElement.parentElement;
            if (card) card.classList.add('aiv-project-card');
          });

          var lineCounts = descs.map(function (p) {
            var cs = getComputedStyle(p);
            var lh = parseFloat(cs.lineHeight);
            if (!lh || isNaN(lh)) lh = parseFloat(cs.fontSize) * 1.5;
            return Math.max(1, Math.round(p.scrollHeight / lh));
          });
          var minLines = Math.max(1, Math.min.apply(null, lineCounts));

          descs.forEach(function (p) { p.style.webkitLineClamp = String(minLines); });
        }

        function addExperienceTechPills() {
          var section = document.getElementById('experience');
          if (!section || section.dataset.aivTechPills) return;

          var cards = section.querySelectorAll('.bg-gray-800.rounded-lg');
          if (!cards.length) return;
          section.dataset.aivTechPills = '1';

          cards.forEach(function (card) {
            var h3 = card.querySelector('h3');
            var title = h3 ? h3.textContent.trim() : '';
            var techs = EXPERIENCE_TECH[title];
            if (!techs || !techs.length) return;

            var row = document.createElement('div');
            row.className = 'aiv-exp-tech';
            techs.forEach(function (t) {
              var span = document.createElement('span');
              span.textContent = t;
              row.appendChild(span);
            });
            card.appendChild(row);
          });
        }

        function insertMarquee() {
          var home = document.getElementById('home');
          if (!home || document.querySelector('.aiv-marquee-wrap')) return;

          var wrap = document.createElement('div');
          wrap.className = 'aiv-marquee-wrap';
          var track = document.createElement('div');
          track.className = 'aiv-marquee-track';
          var items = MARQUEE_SKILLS.concat(MARQUEE_SKILLS)
            .map(function (s) { return '<span>' + s + '</span>'; })
            .join('');
          track.innerHTML = items;
          wrap.appendChild(track);

          home.insertAdjacentElement('afterend', wrap);
        }

        var GITHUB_EVENTS_API = 'https://api.github.com/users/muhammadaliismoilov/events/public';
        var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        function formatActivityDate(d) {
          var hh = String(d.getHours()).padStart(2, '0');
          var mm = String(d.getMinutes()).padStart(2, '0');
          return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear() + ' at ' + hh + ':' + mm;
        }

        function renderActivityCard(mount, since) {
          var card = document.createElement('div');
          card.className = 'aiv-activity-card';

          function unit(u, label) {
            return '<div class="aiv-activity-unit"><span class="aiv-activity-num" data-u="' + u + '">00</span>' +
              '<div class="aiv-activity-unitlabel">' + label + '</div></div>';
          }
          var sep = '<span class="aiv-activity-sep">:</span>';

          card.innerHTML =
            '<div class="aiv-activity-label"><span class="aiv-activity-dot"></span>Last active on GitHub</div>' +
            '<div class="aiv-activity-units">' +
              unit('d', 'DAYS') + sep + unit('h', 'HRS') + sep + unit('m', 'MIN') + sep + unit('s', 'SEC') +
            '</div>' +
            '<div class="aiv-activity-date">' + formatActivityDate(since) + '</div>';
          mount.appendChild(card);

          var nums = {};
          ['d', 'h', 'm', 's'].forEach(function (u) { nums[u] = card.querySelector('[data-u="' + u + '"]'); });
          var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          function setUnit(u, val) {
            var el = nums[u];
            var text = String(val).padStart(2, '0');
            if (el.textContent === text) return;
            el.textContent = text;
            if (!reduceMotion) {
              el.classList.remove('aiv-flip');
              void el.offsetWidth;
              el.classList.add('aiv-flip');
            }
          }

          function tick() {
            var diff = Math.max(0, Date.now() - since.getTime());
            var s = Math.floor(diff / 1000);
            var d = Math.floor(s / 86400); s -= d * 86400;
            var h = Math.floor(s / 3600); s -= h * 3600;
            var m = Math.floor(s / 60); s -= m * 60;
            setUnit('d', d); setUnit('h', h); setUnit('m', m); setUnit('s', s);
          }
          tick();
          setInterval(tick, 1000);
        }

        function insertActivityCard() {
          var mount = document.querySelector('#contact .max-w-lg');
          if (!mount || mount.dataset.aivActivity) return;
          mount.dataset.aivActivity = '1';

          fetch(GITHUB_EVENTS_API)
            .then(function (r) { if (!r.ok) throw new Error('github api error'); return r.json(); })
            .then(function (events) {
              if (!events || !events.length || !events[0].created_at) throw new Error('no events');
              renderActivityCard(mount, new Date(events[0].created_at));
            })
            .catch(function () { /* fail silently — no card if GitHub API is unavailable */ });
        }

        function inject() {
          fixSocialLinksAccessibility();
          groupSkills();
          rebuildHero();
          insertMarquee();
          insertActivityCard();
          rebuildContactSocial();
          addExperienceTechPills();
          equalizeProjectCards();

          var row = document.querySelector('header nav > div');
          if (!row || row.querySelector('.aiv-extra')) return;

          var extra = document.createElement('div');
          extra.className = 'aiv-extra';

          var cvBtn = document.createElement('a');
          cvBtn.href = CV_HREF;
          cvBtn.download = 'Ali_Ismoilov_CV.pdf';
          cvBtn.className = 'aiv-cv-btn aiv-cv-btn-desktop';
          cvBtn.innerHTML = cvIconSvg + '<span>Download CV</span>';
          extra.appendChild(cvBtn);

          hamburgerBtn = document.createElement('button');
          hamburgerBtn.type = 'button';
          hamburgerBtn.className = 'aiv-hamburger';
          hamburgerBtn.setAttribute('aria-label', 'Open menu');
          hamburgerBtn.setAttribute('aria-expanded', 'false');
          hamburgerBtn.innerHTML = burgerSvg;
          hamburgerBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleMenu();
          });
          extra.appendChild(hamburgerBtn);

          row.appendChild(extra);

          if (!mobileMenu) mobileMenu = buildMobileMenu();
        }

        document.addEventListener('click', function (e) {
          if (!menuOpen) return;
          if (mobileMenu && mobileMenu.contains(e.target)) return;
          if (hamburgerBtn && hamburgerBtn.contains(e.target)) return;
          closeMenu();
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeMenu();
        });
        window.addEventListener('resize', function () {
          if (window.innerWidth >= 768) closeMenu();
        });

        var observer = new MutationObserver(function () {
          var header = document.querySelector('header nav > div');
          if (header && !header.querySelector('.aiv-extra')) inject();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        inject();
      })();
    </script>
  </body>
</html>
